[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptor"
version = "1.0.0"
description = "Pipeline de OCR e conversão PDF/A com grau arquivístico"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "James" }]
keywords = ["ocr", "pdfa", "tesseract", "ocrmypdf", "arquivo", "digitalizacao"]

# Tetos por versão maior são deliberados: este projeto é distribuído como kit e
# instalado com `pip install` na máquina do operador, sem lock file e muitas
# vezes meses depois do último teste. Uma major nova do OCRmyPDF chegando por
# resolução automática quebraria a instalação de quem só deu um duplo clique.
dependencies = [
  "ocrmypdf>=16.0,<18.0",
  "pikepdf>=8.0,<11.0",
  "typer>=0.12,<1.0",
  "rich>=13.0,<15.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reportlab>=4.0"]

[project.scripts]
scriptor = "scriptor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: exercita o pipeline completo com OCR real"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# "S" é flake8-bandit: um projeto que executa subprocessos e sobe um servidor
# HTTP não deveria depender de revisão humana para lembrar disso.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Texto em português usa travessão, aspas tipográficas e reticências.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# O Typer resolve as anotações em tempo de execução; `Optional[X]` é a forma
# que ele documenta e a que funciona em todas as versões suportadas.
"src/scriptor/cli.py" = ["UP045", "UP007"]
# Em teste, `assert` é o ponto, e chamar subprocesso é o que se está testando.
"tests/**" = ["S101", "S603", "S607", "S311"]
